<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美味订餐 · 管理员端</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="logo">⚙️ 管理员端</div>
  <nav class="nav">
    <a href="index.html">用户端</a>
    <a href="rider.html">骑手端</a>
    <a href="admin.html" class="active">管理员端</a>
  </nav>
  <div class="user-chip" id="userChip"></div>
</header>

<!-- 登录 -->
<div id="authView">
  <div class="auth-box card">
    <h2 style="text-align:center">⚙️ 管理员登录</h2>
    <form onsubmit="handleLogin(event)">
      <div class="field">
        <label>管理员账号</label>
        <input type="tel" id="loginPhone" placeholder="管理员手机号" value="" maxlength="11">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="loginPassword" placeholder="请输入密码">
      </div>
      <button type="submit" class="btn btn-primary btn-block">登录</button>
      <div class="auth-tip">请输入正确内容<br>请确保您所在的页面正确</div>
    </form>
  </div>
</div>

<!-- 管理员主界面 -->
<div id="appView" class="hidden">
  <div class="wrap">

    <div class="tabs">
      <button class="active" data-tab="fee" onclick="switchTab('fee')">💰 服务费管理</button>
      <button data-tab="users" onclick="switchTab('users')">👥 用户 / 骑手管理</button>
      <button data-tab="orders" onclick="switchTab('orders')">📦 订单管理</button>
    </div>

    <!-- 服务费管理 -->
    <div class="card" id="tab-fee">
      <h2>💰 服务费设置</h2>
      <p class="muted mb16">服务费会在用户下单时自动计入总价，默认 1.5 元。修改后立即对所有订单生效。</p>
      <div class="row2">
        <div class="field">
          <label>当前服务费（元）</label>
          <input type="number" id="serviceFeeInput" min="0" step="0.01">
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button class="btn btn-primary btn-block" onclick="saveFee()">保存修改</button>
        </div>
      </div>
      <div class="fee-tag" id="feeTag">当前服务费：¥1.5</div>
    </div>

    <!-- 用户管理 -->
    <div class="card hidden" id="tab-users">
      <h2>👥 用户 / 骑手管理</h2>
      <p class="muted mb16">普通用户注册后默认为“普通用户”，可在此设置为“骑手”，骑手即可登录骑手端接收派送订单。</p>
      <div style="overflow-x:auto">
        <table class="table">
          <thead><tr><th>ID</th><th>名称</th><th>手机号</th><th>角色</th><th>注册时间</th><th>操作</th></tr></thead>
          <tbody id="userTable"></tbody>
        </table>
      </div>
    </div>

    <!-- 订单管理 -->
    <div class="card hidden" id="tab-orders">
      <h2>📦 全部订单</h2>
      <div id="orderList"></div>
    </div>

  </div>
</div>

<!-- 订单详情弹窗 -->
<div class="modal-mask" id="detailModal">
  <div class="modal">
    <button class="close" onclick="closeModal('detailModal')">✕</button>
    <h2>📄 订单详情</h2>
    <div id="detailContent"></div>
    <div class="qr-box" id="detailQrBox"><img id="detailQrImg" alt="订单二维码"></div>
  </div>
</div>

<div id="toast-box"></div>

<script>
var state = { token: localStorage.getItem('admin_token') || '', user: null };
try { state.user = JSON.parse(localStorage.getItem('admin_user') || 'null'); } catch (e) { state.user = null; }

function toast(msg, isWarn) {
  var box = document.getElementById('toast-box');
  var el = document.createElement('div');
  el.className = 'toast';
  if (isWarn) el.style.background = '#dc2626';
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(function () { el.remove(); }, 3000);
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

async function api(path, options) {
  options = options || {};
  var headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  var res = await fetch(path, Object.assign({}, options, { headers: headers }));
  var data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    var err = new Error(data.error || '请求失败');
    err.status = res.status;
    throw err;
  }
  return data;
}

function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-mask').forEach(function (m) {
  m.addEventListener('click', function (e) { if (e.target === m) m.classList.remove('show'); });
});
function money(n) { return '¥' + Number(n || 0).toFixed(2); }
function fmtDT(v) { try { var d = new Date(v); if (isNaN(d.getTime())) return String(v || ''); var p = function (x) { return String(x).padStart(2, '0'); }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); } catch (e) { return String(v || ''); } }

/* 登录 */
async function handleLogin(e) {
  e.preventDefault();
  var phone = document.getElementById('loginPhone').value.trim();
  var password = document.getElementById('loginPassword').value;
  if (!phone || !password) return toast('请输入账号和密码');
  try {
    var data = await api('/api/admin/login', { method: 'POST', body: JSON.stringify({ phone: phone, password: password }) });
    state.token = data.token;
    state.user = data.user;
    localStorage.setItem('admin_token', data.token);
    localStorage.setItem('admin_user', JSON.stringify(data.user));
    renderHeader();
    showApp();
    loadAll();
    toast('管理员登录成功');
  } catch (err) { toast(err.message, true); }
}

function logout() {
  state.token = '';
  state.user = null;
  localStorage.removeItem('admin_token');
  localStorage.removeItem('admin_user');
  renderHeader();
  document.getElementById('authView').classList.remove('hidden');
  document.getElementById('appView').classList.add('hidden');
  toast('已退出登录');
}

function renderHeader() {
  var chip = document.getElementById('userChip');
  if (state.user) {
    chip.innerHTML = '<span>👤 ' + esc(state.user.name) + '</span><button class="out" onclick="logout()">退出</button>';
  } else {
    chip.innerHTML = '<span>未登录</span>';
  }
}

function showApp() {
  document.getElementById('authView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
}

/* 标签页 */
function switchTab(tab) {
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.classList.toggle('active', b.getAttribute('data-tab') === tab);
  });
  ['fee', 'users', 'orders'].forEach(function (t) {
    document.getElementById('tab-' + t).classList.toggle('hidden', t !== tab);
  });
}

/* 加载全部 */
async function loadAll() {
  await Promise.all([loadFee(), loadUsers(), loadOrders()]);
}

async function loadFee() {
  try {
    var data = await api('/api/config');
    document.getElementById('serviceFeeInput').value = data.serviceFee;
    document.getElementById('feeTag').textContent = '当前服务费：¥' + Number(data.serviceFee).toFixed(2);
  } catch (err) { toast(err.message); }
}

async function saveFee() {
  var fee = parseFloat(document.getElementById('serviceFeeInput').value);
  if (!(fee >= 0)) return toast('请输入有效的服务费金额');
  try {
    var data = await api('/api/admin/config', { method: 'PUT', body: JSON.stringify({ serviceFee: fee }) });
    document.getElementById('serviceFeeInput').value = data.serviceFee;
    document.getElementById('feeTag').textContent = '当前服务费：¥' + Number(data.serviceFee).toFixed(2);
    toast('服务费已更新为 ¥' + Number(data.serviceFee).toFixed(2));
  } catch (err) { toast(err.message, true); }
}

async function loadUsers() {
  try {
    var data = await api('/api/admin/users');
    var users = data.users || [];
    var tbody = document.getElementById('userTable');
    if (!users.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="center muted" style="padding:24px">暂无注册用户</td></tr>';
      return;
    }
    var html = '';
    users.forEach(function (u) {
      var isRider = u.role === 'rider';
      html += '<tr>' +
        '<td>' + u.id + '</td>' +
        '<td>' + esc(u.name) + '</td>' +
        '<td>' + esc(u.phone) + '</td>' +
        '<td><span class="badge ' + (isRider ? 'rider' : 'user') + '">' + esc(u.roleText) + '</span></td>' +
        '<td class="muted">' + esc(fmtDT(u.createdAt)) + '</td>' +
        '<td>' +
        (isRider
          ? '<button class="btn btn-sm btn-danger-ghost" onclick="setRole(\'' + esc(u.phone) + '\',\'user\')">取消骑手</button>'
          : '<button class="btn btn-sm btn-green" onclick="setRole(\'' + esc(u.phone) + '\',\'rider\')">设为骑手</button>') +
        '</td></tr>';
    });
    tbody.innerHTML = html;
  } catch (err) { toast(err.message); }
}

async function setRole(phone, role) {
  try {
    var data = await api('/api/admin/set-role', { method: 'POST', body: JSON.stringify({ phone: phone, role: role }) });
    toast(role === 'rider' ? data.user.name + ' 已成为骑手 🛵' : data.user.name + ' 已取消骑手资格');
    loadUsers();
  } catch (err) { toast(err.message, true); }
}

async function loadOrders() {
  try {
    var data = await api('/api/admin/orders');
    var orders = data.orders || [];
    var box = document.getElementById('orderList');
    if (!orders.length) {
      box.innerHTML = '<div class="empty"><span class="big">📭</span>暂无订单</div>';
      return;
    }
    var html = '';
    orders.forEach(function (o) {
      html += '' +
        '<div class="order-card">' +
        '<div class="top"><span class="no">' + esc(o.orderNo) + '</span><span class="badge ' + esc(o.status) + '">' + esc(o.statusText) + '</span></div>' +
        '<div class="meta">' +
        '<div>🔖 <b>' + esc(o.typeText) + '</b> · ' + esc(o.content) + '</div>' +
        '<div>' + (o.type === 'door' ? '🏠 上门时间' : '🛵 送达时间') + '：<b>' + esc(o.timeText) + '</b></div>' +
        '<div>👤 ' + esc(o.name) + '（' + esc(o.phone) + '） · 下单 ' + esc(o.createdText) + '</div>' +
        '</div>' +
        '<div class="bottom"><span class="total-price">' + money(o.total) + '</span>' +
        '<button class="btn btn-sm btn-ghost" onclick="showDetail(\'' + o.id + '\')">查看详情</button></div>' +
        '</div>';
    });
    box.innerHTML = html;
  } catch (err) { toast(err.message); }
}

async function showDetail(id) {
  try {
    var data = await api('/api/orders/' + id);
    var o = data.order;
    var qrData = await api('/api/orders/' + id + '/qr');
    document.getElementById('detailContent').innerHTML = '' +
      '<div class="detail-row"><span class="k">订单号</span><span class="v">' + esc(o.orderNo) + '</span></div>' +
      '<div class="detail-row"><span class="k">订单类型</span><span class="v">' + esc(o.typeText) + '</span></div>' +
      '<div class="detail-row"><span class="k">内容</span><span class="v">' + esc(o.content) + '</span></div>' +
      '<div class="detail-row"><span class="k">' + (o.type === 'door' ? '上门时间' : '送达时间') + '</span><span class="v">' + esc(o.timeText) + '</span></div>' +
      '<div class="detail-row"><span class="k">个人预估费用</span><span class="v">' + money(o.estimatedFee) + '</span></div>' +
      '<div class="detail-row"><span class="k">服务费</span><span class="v">' + money(o.serviceFee) + '</span></div>' +
      '<div class="detail-row"><span class="k">总价</span><span class="v" style="color:#e85a26">' + money(o.total) + '</span></div>' +
      (o.pickupCode ? '<div class="detail-row"><span class="k">取餐码</span><span class="v">' + esc(o.pickupCode) + '</span></div>' : '') +
      '<div class="detail-row"><span class="k">下单人</span><span class="v">' + esc(o.name) + '</span></div>' +
      '<div class="detail-row"><span class="k">联系电话</span><span class="v">' + esc(o.phone) + '</span></div>' +
      '<div class="detail-row"><span class="k">下单时间</span><span class="v">' + esc(o.createdText) + '</span></div>' +
      '<div class="detail-row"><span class="k">订单状态</span><span class="v">' + esc(o.statusText) + '</span></div>';
    var qrImg = document.getElementById('detailQrImg');
    var prev = qrImg.previousElementSibling;
    if (!prev || prev.className !== 'qr-title') {
      prev = document.createElement('div');
      prev.className = 'qr-title';
      qrImg.parentNode.insertBefore(prev, qrImg);
    }
    prev.textContent = o.type === 'door' ? '上门二维码' : '取餐二维码';
    qrImg.src = qrData.qr;
    openModal('detailModal');
  } catch (err) { toast(err.message); }
}

/* 初始化 */
renderHeader();
if (state.token && state.user) {
  showApp();
  loadAll();
} else {
  document.getElementById('authView').classList.remove('hidden');
}
</script>
</body>
</html>
