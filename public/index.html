<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美味订餐 · 用户端</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="logo">🍜 美味订餐</div>
  <nav class="nav">
    <a href="index.html" class="active">用户端</a>
    <a href="rider.html">骑手端</a>
    <a href="admin.html">管理员端</a>
  </nav>
  <div class="user-chip" id="userChip"></div>
</header>

<!-- ============ 登录 / 注册 ============ -->
<div id="authView">
  <div class="auth-box card">
    <div class="auth-tabs">
      <button id="tabLogin" class="active" onclick="switchAuth('login')">登录</button>
      <button id="tabRegister" onclick="switchAuth('register')">注册</button>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field">
        <label>手机号</label>
        <input type="tel" id="loginPhone" placeholder="请输入 11 位手机号" maxlength="11">
      </div>
      <button type="submit" class="btn btn-primary btn-block">登录</button>
      <div class="auth-tip">登录只需手机号，无需验证码</div>
    </form>

    <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
      <div class="field">
        <label>手机号</label>
        <input type="tel" id="regPhone" placeholder="请输入 11 位手机号" maxlength="11">
      </div>
      <div class="field">
        <label>名称</label>
        <input type="text" id="regName" placeholder="请输入您的名称 / 昵称">
      </div>
      <button type="submit" class="btn btn-primary btn-block">注册并登录</button>
      <div class="auth-tip">注册只需手机号和名称<br>注册后即为普通用户，骑手资格需管理员后台开通</div>
    </form>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="appView" class="hidden">
  <div class="wrap">

    <div class="card">
      <div class="between">
        <h2>👋 你好，<span id="welcomeName"></span></h2>
        <span class="fee-tag" id="feeTag">服务费 ¥1.5</span>
      </div>
      <p class="muted mb8">服务费由平台统一设定，仅管理员可修改，下单时自动计入总价。</p>
    </div>

    <!-- 选择服务类型 -->
    <div class="card">
      <h2>📋 选择服务</h2>
      <div class="type-grid">
        <button class="type-btn active" id="typeDoor" onclick="selectType('door')">
          <span class="ico">🏠</span>
          <span class="t">预约上门服务</span>
          <span class="s">服务人员按约上门</span>
        </button>
        <button class="type-btn" id="typeDelivery" onclick="selectType('delivery')">
          <span class="ico">🛵</span>
          <span class="t">订餐外卖</span>
          <span class="s">骑手配送 · 扫码取餐</span>
        </button>
      </div>
    </div>

    <!-- 下单表单 -->
    <div class="card">
      <h2 id="formTitle">📝 填写上门服务信息</h2>

      <div class="field">
        <label id="contentLabel">服务内容</label>
        <textarea id="orderContent" placeholder="请详细填写服务内容 / 外卖内容"></textarea>
      </div>

      <div class="row2">
        <div class="field">
          <label id="timeLabel">上门时间</label>
          <input type="datetime-local" id="orderTime">
        </div>
        <div class="field">
          <label>个人预估费用（元）</label>
          <input type="number" id="orderFee" min="0" step="0.01" placeholder="例如 50">
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label>服务费（平台设置，不可修改）</label>
          <input type="number" id="serviceFeeInput" readonly step="0.01">
        </div>
        <div class="field">
          <label>总价（预估费用 + 服务费）</label>
          <input type="text" id="totalInput" readonly placeholder="¥0.00">
        </div>
      </div>

      <button class="btn btn-primary btn-block" id="submitBtn" onclick="submitOrder()">立即下单</button>
    </div>

    <!-- 我的订单 -->
    <div class="section-title"><span class="line"></span><h2>🧾 我的订单</h2><span class="line"></span></div>
    <div id="orderList"></div>

  </div>
</div>

<!-- ============ 下单成功弹窗 ============ -->
<div class="modal-mask" id="successModal">
  <div class="modal">
    <button class="close" onclick="closeModal('successModal')">✕</button>
    <h2>🎉 下单成功</h2>
    <div class="qr-title" id="successQrTitle">取餐二维码</div>
    <div class="qr-box"><img id="successQrImg" alt="订单二维码"></div>
    <div class="center" id="successPickupWrap">
      <div class="muted">取餐码</div>
      <div class="pickup-code" id="successPickupCode">0000</div>
    </div>
    <div class="mt16" id="successSummary"></div>
    <div class="flex mt16" style="gap:10px;">
      <button class="btn btn-ghost" style="flex:1" onclick="closeModal('successModal'); loadMyOrders();">查看我的订单</button>
      <button class="btn btn-primary" style="flex:1" onclick="closeModal('successModal')">继续下单</button>
    </div>
  </div>
</div>

<!-- ============ 订单详情弹窗 ============ -->
<div class="modal-mask" id="detailModal">
  <div class="modal">
    <button class="close" onclick="closeModal('detailModal')">✕</button>
    <h2>📄 订单详情</h2>
    <div id="detailContent"></div>
    <div class="qr-box" id="detailQrBox"><img id="detailQrImg" alt="订单二维码"></div>
  </div>
</div>

<div id="toast-box"></div>

<script>
var state = {
  token: localStorage.getItem('token') || '',
  user: null,
  serviceFee: 1.5,
  orderType: 'door'
};
try { state.user = JSON.parse(localStorage.getItem('user') || 'null'); } catch (e) { state.user = null; }

/* ---------- 工具 ---------- */
function toast(msg) {
  var box = document.getElementById('toast-box');
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(function () { el.remove(); }, 2600);
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

async function api(path, options) {
  options = options || {};
  var headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  var res = await fetch(path, Object.assign({}, options, { headers: headers }));
  var data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    var err = new Error(data.error || '请求失败，请重试');
    err.status = res.status;
    throw err;
  }
  return data;
}

function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-mask').forEach(function (m) {
  m.addEventListener('click', function (e) { if (e.target === m) m.classList.remove('show'); });
});

function money(n) { return '¥' + Number(n || 0).toFixed(2); }

/* ---------- 登录 / 注册 ---------- */
function switchAuth(tab) {
  var isLogin = tab === 'login';
  document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
  document.getElementById('registerForm').classList.toggle('hidden', isLogin);
  document.getElementById('tabLogin').classList.toggle('active', isLogin);
  document.getElementById('tabRegister').classList.toggle('active', !isLogin);
}

async function handleLogin(e) {
  e.preventDefault();
  var phone = document.getElementById('loginPhone').value.trim();
  if (!/^1\d{10}$/.test(phone)) return toast('请输入正确的 11 位手机号');
  try {
    var data = await api('/api/login', { method: 'POST', body: JSON.stringify({ phone: phone }) });
    onLoginSuccess(data);
  } catch (err) { toast(err.message); }
}

async function handleRegister(e) {
  e.preventDefault();
  var phone = document.getElementById('regPhone').value.trim();
  var name = document.getElementById('regName').value.trim();
  if (!/^1\d{10}$/.test(phone)) return toast('请输入正确的 11 位手机号');
  if (!name) return toast('请输入名称');
  try {
    var data = await api('/api/register', { method: 'POST', body: JSON.stringify({ phone: phone, name: name }) });
    onLoginSuccess(data);
    toast('注册成功，欢迎使用 🎉');
  } catch (err) { toast(err.message); }
}

function onLoginSuccess(data) {
  state.token = data.token;
  state.user = data.user;
  localStorage.setItem('token', data.token);
  localStorage.setItem('user', JSON.stringify(data.user));
  renderHeader();
  showApp();
}

function logout() {
  state.token = '';
  state.user = null;
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  renderHeader();
  showAuth();
  toast('已退出登录');
}

function renderHeader() {
  var chip = document.getElementById('userChip');
  if (state.user) {
    chip.innerHTML = '<span>👤 ' + esc(state.user.name) + '</span><button class="out" onclick="logout()">退出</button>';
  } else {
    chip.innerHTML = '<span>未登录</span>';
  }
}

function showAuth() {
  document.getElementById('authView').classList.remove('hidden');
  document.getElementById('appView').classList.add('hidden');
}

function showApp() {
  document.getElementById('authView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  document.getElementById('welcomeName').textContent = state.user.name;
  loadConfig();
  loadMyOrders();
}

/* ---------- 服务费 / 下单 ---------- */
async function loadConfig() {
  try {
    var data = await api('/api/config');
    state.serviceFee = data.serviceFee;
    document.getElementById('feeTag').textContent = '服务费 ¥' + Number(data.serviceFee).toFixed(2);
    document.getElementById('serviceFeeInput').value = data.serviceFee;
    updateTotal();
  } catch (err) { toast('获取服务费失败'); }
}

function selectType(type) {
  state.orderType = type;
  document.getElementById('typeDoor').classList.toggle('active', type === 'door');
  document.getElementById('typeDelivery').classList.toggle('active', type === 'delivery');
  var isDoor = type === 'door';
  document.getElementById('formTitle').textContent = isDoor ? '📝 填写上门服务信息' : '📝 填写外卖信息';
  document.getElementById('contentLabel').textContent = isDoor ? '服务内容' : '外卖内容';
  document.getElementById('timeLabel').textContent = isDoor ? '上门时间' : '送达时间';
  document.getElementById('orderContent').placeholder = isDoor ? '请详细填写需要上门服务的内容' : '请填写外卖内容（例如：红烧牛肉面 1 份）';
}

function updateTotal() {
  var fee = parseFloat(document.getElementById('orderFee').value) || 0;
  var total = fee + state.serviceFee;
  document.getElementById('totalInput').value = money(total);
}

document.getElementById('orderFee').addEventListener('input', updateTotal);

async function submitOrder() {
  var content = document.getElementById('orderContent').value.trim();
  var scheduledTime = document.getElementById('orderTime').value;
  var fee = parseFloat(document.getElementById('orderFee').value);
  if (!content) return toast('请填写' + (state.orderType === 'door' ? '服务内容' : '外卖内容'));
  if (!scheduledTime) return toast('请选择' + (state.orderType === 'door' ? '上门时间' : '送达时间'));
  if (!(fee >= 0)) return toast('请填写有效的个人预估费用');
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '下单中...';
  try {
    var data = await api('/api/orders', {
      method: 'POST',
      body: JSON.stringify({ type: state.orderType, content: content, scheduledTime: scheduledTime, estimatedFee: fee })
    });
    showSuccess(data);
  } catch (err) {
    toast(err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '立即下单';
  }
}

function showSuccess(data) {
  var o = data.order;
  var isDoor = o.type === 'door';
  document.getElementById('successQrTitle').textContent = isDoor ? '上门二维码' : '取餐二维码';
  document.getElementById('successQrImg').src = data.qr ? data.qr : '';
  document.getElementById('successPickupWrap').classList.toggle('hidden', !o.pickupCode);
  if (o.pickupCode) document.getElementById('successPickupCode').textContent = o.pickupCode;
  document.getElementById('successSummary').innerHTML = buildSummary(o);
  openModal('successModal');
  loadMyOrders();
}

function buildSummary(o) {
  return '' +
    '<div class="detail-row"><span class="k">订单号</span><span class="v">' + esc(o.orderNo) + '</span></div>' +
    '<div class="detail-row"><span class="k">类型</span><span class="v">' + esc(o.typeText) + '</span></div>' +
    '<div class="detail-row"><span class="k">内容</span><span class="v">' + esc(o.content) + '</span></div>' +
    '<div class="detail-row"><span class="k">' + (isDoor(o) ? '上门时间' : '送达时间') + '</span><span class="v">' + esc(o.timeText) + '</span></div>' +
    '<div class="detail-row"><span class="k">预估费用</span><span class="v">' + money(o.estimatedFee) + '</span></div>' +
    '<div class="detail-row"><span class="k">服务费</span><span class="v">' + money(o.serviceFee) + '</span></div>' +
    '<div class="detail-row"><span class="k">总价</span><span class="v" style="color:#e85a26">' + money(o.total) + '</span></div>' +
    '<div class="detail-row"><span class="k">状态</span><span class="v">' + esc(o.statusText) + '</span></div>';
}
function isDoor(o) { return o.type === 'door'; }

/* ---------- 我的订单 ---------- */
async function loadMyOrders() {
  var box = document.getElementById('orderList');
  try {
    var data = await api('/api/orders');
    var orders = data.orders || [];
    if (!orders.length) {
      box.innerHTML = '<div class="card"><div class="empty"><span class="big">🍽️</span>还没有订单，快去下一单吧</div></div>';
      return;
    }
    var html = '';
    orders.forEach(function (o) {
      html += '' +
        '<div class="order-card">' +
        '<div class="top"><span class="no">' + esc(o.orderNo) + '</span><span class="badge ' + esc(o.status) + '">' + esc(o.statusText) + '</span></div>' +
        '<div class="meta">' +
        '<div>' + esc(o.typeText) + ' · ' + esc(o.content) + '</div>' +
        '<div>' + (o.type === 'door' ? '上门时间' : '送达时间') + '：<b>' + esc(o.timeText) + '</b></div>' +
        '</div>' +
        '<div class="bottom"><span class="total-price">' + money(o.total) + '</span>' +
        '<button class="btn btn-sm btn-ghost" onclick="showOrderDetail(\'' + o.id + '\')">查看详情</button></div>' +
        '</div>';
    });
    box.innerHTML = html;
  } catch (err) {
    box.innerHTML = '<div class="card"><div class="empty">加载订单失败</div></div>';
  }
}

async function showOrderDetail(id) {
  try {
    var data = await api('/api/orders/' + id);
    var o = data.order;
    var qrData = await api('/api/orders/' + id + '/qr');
    var html = '' +
      '<div class="detail-row"><span class="k">订单号</span><span class="v">' + esc(o.orderNo) + '</span></div>' +
      '<div class="detail-row"><span class="k">订单类型</span><span class="v">' + esc(o.typeText) + '</span></div>' +
      '<div class="detail-row"><span class="k">内容</span><span class="v">' + esc(o.content) + '</span></div>' +
      '<div class="detail-row"><span class="k">' + (o.type === 'door' ? '上门时间' : '送达时间') + '</span><span class="v">' + esc(o.timeText) + '</span></div>' +
      '<div class="detail-row"><span class="k">个人预估费用</span><span class="v">' + money(o.estimatedFee) + '</span></div>' +
      '<div class="detail-row"><span class="k">服务费</span><span class="v">' + money(o.serviceFee) + '</span></div>' +
      '<div class="detail-row"><span class="k">总价</span><span class="v" style="color:#e85a26">' + money(o.total) + '</span></div>' +
      (o.pickupCode ? '<div class="detail-row"><span class="k">取餐码</span><span class="v">' + esc(o.pickupCode) + '</span></div>' : '') +
      '<div class="detail-row"><span class="k">下单人</span><span class="v">' + esc(o.name) + '</span></div>' +
      '<div class="detail-row"><span class="k">联系电话</span><span class="v">' + esc(o.phone) + '</span></div>' +
      '<div class="detail-row"><span class="k">下单时间</span><span class="v">' + esc(o.createdText) + '</span></div>' +
      '<div class="detail-row"><span class="k">订单状态</span><span class="v">' + esc(o.statusText) + '</span></div>';
    document.getElementById('detailContent').innerHTML = html;
    var qrImg = document.getElementById('detailQrImg');
    var qrTitle = qrImg.previousElementSibling;
    if (!qrTitle || qrTitle.className !== 'qr-title') {
      qrTitle = document.createElement('div');
      qrTitle.className = 'qr-title';
      qrImg.parentNode.insertBefore(qrTitle, qrImg);
    }
    qrTitle.textContent = o.type === 'door' ? '上门二维码' : '取餐二维码';
    qrImg.src = qrData.qr;
    openModal('detailModal');
  } catch (err) {
    toast(err.message);
  }
}

/* ---------- 初始化 ---------- */
renderHeader();
if (state.token && state.user) {
  showApp();
} else {
  showAuth();
}
</script>
</body>
</html>
