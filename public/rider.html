<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美味订餐 · 骑手端</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="logo">🛵 骑手端</div>
  <nav class="nav">
    <a href="index.html">用户端</a>
    <a href="rider.html" class="active">骑手端</a>
    <a href="admin.html">管理员端</a>
  </nav>
  <div class="user-chip" id="userChip"></div>
</header>

<!-- 登录 -->
<div id="authView">
  <div class="auth-box card">
    <h2 style="text-align:center">🛵 骑手登录</h2>
    <form onsubmit="handleLogin(event)">
      <div class="field">
        <label>手机号</label>
        <input type="tel" id="loginPhone" placeholder="请输入已注册的手机号" maxlength="11">
      </div>
      <button type="submit" class="btn btn-primary btn-block">登录</button>
      <div class="auth-tip">
        骑手需先注册普通账户<br>
        再由管理员后台开通骑手资格
      </div>
    </form>
  </div>
</div>

<!-- 骑手主界面 -->
<div id="appView" class="hidden">
  <div class="wrap">

    <div class="notice-banner">
      <span class="dot"></span>
      <span>派送监控中，<b id="pendingCount">0</b> 个待处理订单，新订单将实时提醒</span>
    </div>

    <div class="card">
      <div class="between mb8">
        <h2>📦 派送订单</h2>
        <button class="btn btn-sm btn-ghost" onclick="refreshOrders(true)">刷新</button>
      </div>
      <div id="orderList"></div>
    </div>

  </div>
</div>

<!-- 订单详情弹窗 -->
<div class="modal-mask" id="detailModal">
  <div class="modal">
    <button class="close" onclick="closeModal('detailModal')">✕</button>
    <h2>📄 订单详情</h2>
    <div id="detailContent"></div>
    <div class="qr-box" id="detailQrBox"><img id="detailQrImg" alt="订单二维码"></div>
    <div class="flex mt16" style="gap:10px;" id="detailActions"></div>
  </div>
</div>

<div id="toast-box"></div>

<script>
var state = { token: localStorage.getItem('rider_token') || '', user: null, seen: {}, timer: null, polling: false };
try { state.user = JSON.parse(localStorage.getItem('rider_user') || 'null'); } catch (e) { state.user = null; }

function toast(msg, isWarn) {
  var box = document.getElementById('toast-box');
  var el = document.createElement('div');
  el.className = 'toast';
  if (isWarn) el.style.background = '#dc2626';
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(function () { el.remove(); }, 3000);
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

async function api(path, options) {
  options = options || {};
  var headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  var res = await fetch(path, Object.assign({}, options, { headers: headers }));
  var data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    var err = new Error(data.error || '请求失败');
    err.status = res.status;
    throw err;
  }
  return data;
}

function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-mask').forEach(function (m) {
  m.addEventListener('click', function (e) { if (e.target === m) m.classList.remove('show'); });
});
function money(n) { return '¥' + Number(n || 0).toFixed(2); }

/* 提示音 */
function beep() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.value = 0.15;
    o.start();
    o.stop(ctx.currentTime + 0.35);
    setTimeout(function () {
      var o2 = ctx.createOscillator();
      var g2 = ctx.createGain();
      o2.connect(g2); g2.connect(ctx.destination);
      o2.frequency.value = 660;
      g2.gain.value = 0.15;
      o2.start();
      o2.stop(ctx.currentTime + 0.3);
    }, 320);
  } catch (e) {}
}

/* 登录 */
async function handleLogin(e) {
  e.preventDefault();
  var phone = document.getElementById('loginPhone').value.trim();
  if (!/^1\d{10}$/.test(phone)) return toast('请输入正确的 11 位手机号');
  try {
    var data = await api('/api/login', { method: 'POST', body: JSON.stringify({ phone: phone }) });
    if (data.user.role !== 'rider' && data.user.role !== 'admin') {
      toast('该账号不是骑手，请先注册普通账户并联系管理员开通骑手资格', true);
      return;
    }
    state.token = data.token;
    state.user = data.user;
    localStorage.setItem('rider_token', data.token);
    localStorage.setItem('rider_user', JSON.stringify(data.user));
    renderHeader();
    showApp();
    toast('登录成功，开始接单吧 🛵');
    startPolling();
  } catch (err) { toast(err.message); }
}

function logout() {
  state.token = '';
  state.user = null;
  localStorage.removeItem('rider_token');
  localStorage.removeItem('rider_user');
  stopPolling();
  renderHeader();
  document.getElementById('authView').classList.remove('hidden');
  document.getElementById('appView').classList.add('hidden');
  toast('已退出登录');
}

function renderHeader() {
  var chip = document.getElementById('userChip');
  if (state.user) {
    chip.innerHTML = '<span>👤 ' + esc(state.user.name) + '</span><button class="out" onclick="logout()">退出</button>';
  } else {
    chip.innerHTML = '<span>未登录</span>';
  }
}

function showApp() {
  document.getElementById('authView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
}

/* 轮询派送通知 */
function startPolling() {
  stopPolling();
  state.timer = setInterval(function () { refreshOrders(false); }, 4000);
  refreshOrders(true);
}
function stopPolling() {
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
}

async function refreshOrders(showToast) {
  if (state.polling) return;
  state.polling = true;
  try {
    var data = await api('/api/rider/orders');
    var orders = data.orders || [];
    var pending = orders.filter(function (o) { return o.status === 'pending'; }).length;
    document.getElementById('pendingCount').textContent = pending;

    var isNew = false;
    orders.forEach(function (o) {
      if (!state.seen[o.id]) {
        state.seen[o.id] = true;
        if (Object.keys(state.seen).length > 1 && o.status === 'pending') isNew = true;
      }
    });

    if (isNew) {
      beep();
      toast('🔔 收到新派送订单，请及时处理！', false);
      try {
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification('🍜 新派送订单', { body: '有新订单待处理，请查看骑手端' });
        }
      } catch (e) {}
    }

    renderOrders(orders);
  } catch (err) {
    if (err.status === 401) {
      stopPolling();
      toast('登录已过期，请重新登录', true);
      logout();
    }
  } finally {
    state.polling = false;
  }
}

function renderOrders(orders) {
  var box = document.getElementById('orderList');
  if (!orders.length) {
    box.innerHTML = '<div class="empty"><span class="big">📭</span>暂无派送订单</div>';
    return;
  }
  var html = '';
  orders.forEach(function (o) {
    var statusBadge = '<span class="badge ' + esc(o.status) + '">' + esc(o.statusText) + '</span>';
    html += '' +
      '<div class="order-card">' +
      '<div class="top"><span class="no">' + esc(o.orderNo) + '</span>' + statusBadge + '</div>' +
      '<div class="meta">' +
      '<div>🔖 <b>' + esc(o.typeText) + '</b> · ' + esc(o.content) + '</div>' +
      '<div>' + (o.type === 'door' ? '🏠 上门时间' : '🛵 送达时间') + '：<b>' + esc(o.timeText) + '</b></div>' +
      '<div>👤 ' + esc(o.name) + '（' + esc(o.phone) + '）</div>' +
      (o.pickupCode ? '<div>🔑 取餐码：<b>' + esc(o.pickupCode) + '</b></div>' : '') +
      '</div>' +
      '<div class="bottom"><span class="total-price">' + money(o.total) + '</span>' +
      '<div class="flex">' +
      '<button class="btn btn-sm btn-ghost" onclick="showDetail(\'' + o.id + '\')">详情</button>' +
      (o.status === 'pending' ? '<button class="btn btn-sm btn-green" onclick="setStatus(\'' + o.id + '\',\'accepted\')">接单</button>' : '') +
      (o.status === 'accepted' ? '<button class="btn btn-sm btn-primary" onclick="setStatus(\'' + o.id + '\',\'completed\')">完成</button>' : '') +
      '</div></div>' +
      '</div>';
  });
  box.innerHTML = html;
}

async function setStatus(id, status) {
  try {
    var data = await api('/api/rider/orders/' + id + '/status', { method: 'POST', body: JSON.stringify({ status: status }) });
    toast(status === 'accepted' ? '已接单 ✅' : '订单已完成 🎉');
    refreshOrders(false);
    if (status === 'completed' && document.getElementById('detailModal').classList.contains('show')) {
      closeModal('detailModal');
    }
  } catch (err) { toast(err.message); }
}

async function showDetail(id) {
  try {
    var data = await api('/api/orders/' + id);
    var o = data.order;
    var qrData = await api('/api/orders/' + id + '/qr');
    document.getElementById('detailContent').innerHTML = '' +
      '<div class="detail-row"><span class="k">订单号</span><span class="v">' + esc(o.orderNo) + '</span></div>' +
      '<div class="detail-row"><span class="k">订单类型</span><span class="v">' + esc(o.typeText) + '</span></div>' +
      '<div class="detail-row"><span class="k">内容</span><span class="v">' + esc(o.content) + '</span></div>' +
      '<div class="detail-row"><span class="k">' + (o.type === 'door' ? '上门时间' : '送达时间') + '</span><span class="v">' + esc(o.timeText) + '</span></div>' +
      '<div class="detail-row"><span class="k">个人预估费用</span><span class="v">' + money(o.estimatedFee) + '</span></div>' +
      '<div class="detail-row"><span class="k">服务费</span><span class="v">' + money(o.serviceFee) + '</span></div>' +
      '<div class="detail-row"><span class="k">总价</span><span class="v" style="color:#e85a26">' + money(o.total) + '</span></div>' +
      (o.pickupCode ? '<div class="detail-row"><span class="k">取餐码</span><span class="v">' + esc(o.pickupCode) + '</span></div>' : '') +
      '<div class="detail-row"><span class="k">下单人</span><span class="v">' + esc(o.name) + '</span></div>' +
      '<div class="detail-row"><span class="k">联系电话</span><span class="v">' + esc(o.phone) + '</span></div>' +
      '<div class="detail-row"><span class="k">下单时间</span><span class="v">' + esc(o.createdText) + '</span></div>' +
      '<div class="detail-row"><span class="k">订单状态</span><span class="v">' + esc(o.statusText) + '</span></div>';
    var qrImg = document.getElementById('detailQrImg');
    var prev = qrImg.previousElementSibling;
    if (!prev || prev.className !== 'qr-title') {
      prev = document.createElement('div');
      prev.className = 'qr-title';
      qrImg.parentNode.insertBefore(prev, qrImg);
    }
    prev.textContent = o.type === 'door' ? '上门二维码' : '取餐二维码';
    qrImg.src = qrData.qr;
    document.getElementById('detailActions').innerHTML =
      (o.status === 'pending' ? '<button class="btn btn-green" style="flex:1" onclick="setStatus(\'' + o.id + '\',\'accepted\')">接单</button>' : '') +
      (o.status === 'accepted' ? '<button class="btn btn-primary" style="flex:1" onclick="setStatus(\'' + o.id + '\',\'completed\')">完成订单</button>' : '') +
      '<button class="btn btn-ghost" style="flex:1" onclick="closeModal(\'detailModal\')">关闭</button>';
    openModal('detailModal');
  } catch (err) { toast(err.message); }
}

/* 初始化 */
renderHeader();
if (state.token && state.user && (state.user.role === 'rider' || state.user.role === 'admin')) {
  showApp();
  startPolling();
} else {
  document.getElementById('authView').classList.remove('hidden');
}
if ('Notification' in window && Notification.permission === 'default') {
  Notification.requestPermission().catch(function () {});
}
</script>
</body>
</html>
